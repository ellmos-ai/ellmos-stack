name: ellmos-stack tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip PyYAML pytest ruff

      - name: Lint with Ruff
        run: ruff check .

      - name: Compile service, test, and tool modules
        env:
          PYTHONIOENCODING: utf-8
        run: python -m compileall -q services tests tools

      - name: Run test suite with pytest
        env:
          PYTHONIOENCODING: utf-8
        run: pytest

      - name: Run fallback unit test discovery
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

      - name: Run offline release gate check
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_release_gate.py
