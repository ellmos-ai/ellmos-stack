name: Public stack release gate

on:
  workflow_dispatch:
    inputs:
      ollama_image_tag:
        description: Exact ollama/ollama image tag
        required: true
        default: '0.32.0'
        type: string
      n8n_image_tag:
        description: Exact n8nio/n8n image tag
        required: true
        default: '2.31.1'
        type: string

permissions:
  contents: read

jobs:
  linux-compose-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLLAMA_IMAGE_TAG: ${{ inputs.ollama_image_tag }}
      N8N_IMAGE_TAG: ${{ inputs.n8n_image_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install gate dependency
        run: python -m pip install --upgrade pip PyYAML

      - name: Run offline gate
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m compileall -q services tests tools
          python -m unittest discover -s tests -v
          python tools/check_release_gate.py --release --preflight

      - name: Validate pinned Compose plan
        run: docker compose config --quiet

      - name: Start pinned stack services
        run: docker compose up -d

      - name: Probe local service endpoints
        run: |
          ollama_ready=false
          n8n_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:11434/api/tags >/dev/null; then
              ollama_ready=true
            fi
            if curl --fail --silent --show-error http://127.0.0.1:5678/healthz >/dev/null; then
              n8n_ready=true
            fi
            if [ "$ollama_ready" = true ] && [ "$n8n_ready" = true ]; then
              break
            fi
            sleep 5
          done
          [ "$ollama_ready" = true ]
          [ "$n8n_ready" = true ]

      - name: Record and validate Linux evidence
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p .release-gate
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "platform_linux": True,
              "compose_config_valid": True,
              "services_started": True,
              "ollama_ready": True,
              "n8n_ready": True,
              "bindings_localhost": True,
              "ollama_image": f"ollama/ollama:{os.environ['OLLAMA_IMAGE_TAG']}",
              "n8n_image": f"n8nio/n8n:{os.environ['N8N_IMAGE_TAG']}",
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
          }
          Path(".release-gate/release-gate-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY
          python tools/check_release_gate.py --release --evidence .release-gate/release-gate-evidence.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence-${{ github.sha }}
          path: .release-gate/release-gate-evidence.json
          if-no-files-found: error

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose down --volumes --remove-orphans
